<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Os 10 Melhores Filmes de Hacker</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #000000, #39FF14);
    }

    .login-box {
      width: 350px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 35px #0005;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h2 {
      color: #172b4d;
      margin-bottom: 10px;
    }

    .description {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .notice {
      margin-top: 22px;
      font-size: 11px;
      color: #888;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 7px;
      background: #fff4d6;
      color: #795400;
      font-size: 14px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🔐</div>

    <h2>Portal Filmes</h2>

    <p class="description">
      Seu Streaming grátis!
    </p>

    <form id="loginForm">

      <input
        type="text"
        placeholder="Crie um usuário"
        autocomplete="off"
        required
      >

      <input
        type="password"
        placeholder="Crie uma senha"
        autocomplete="off"
        required
      >

      <button type="submit">
        Entrar
      </button>

    </form>

    <div id="result">
      <strong><3 Tô quase lá, Naju!</strong>
     
    
    </div>

 

   

  </div>

  <script>
    const form = document.getElementById("loginForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      

      result.style.display = "block";
      form.style.display = "none";
    });
  </script>

</body>
</html>
